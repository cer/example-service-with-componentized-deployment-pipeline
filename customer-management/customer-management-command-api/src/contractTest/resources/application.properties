# The saga participant starter pulls in Eventuate's JDBC support, which requires these properties
# even though the contract verifier replaces the transport and nothing is persisted.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:contracttest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
