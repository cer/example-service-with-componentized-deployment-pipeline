apply plugin: 'org.springframework.cloud.contract'
apply plugin: io.eventuate.tram.spring.testing.cloudcontract.plugins.gradle.PublishStubsPlugin

// Only the modules that publish stubs are versioned. The rest of the build leaves version unset
// because customer-service-main/Dockerfile copies the unversioned build/libs/customer-service-main.jar.
version = stubsVersion

dependencies {
    implementation project(":customer-management:customer-management-domain")
    implementation project(":customer-management:customer-management-sagas")
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-api:$springdocVersion"

    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-security-test"

    contractTestImplementation "org.springframework.cloud:spring-cloud-starter-contract-verifier"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-test"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-security-test"
}

contracts {
    testFramework = "JUNIT5"
    basePackageForTests = "io.eventuate.customerservice.customermanagement.restapi"
    baseClassForTests = "io.eventuate.customerservice.customermanagement.restapi.ContractVerifierBase"
}
