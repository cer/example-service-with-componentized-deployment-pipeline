plugins {
    id 'io.eventuate.plugins.gradle.testing.integration-tests'
}

apply plugin: 'org.springframework.cloud.contract'

// The contracts for the commands customer-service sends are owned by each saga participant, which
// publishes them as a stubs jar to mavenLocal. src/contractTest/resources/participants has one
// properties file per participant: the stubs' Maven coordinates, group:artifact, and the base class
// of the tests generated from its command contracts.
def participants = fileTree('src/contractTest/resources/participants').files.sort().collect { file ->
    def properties = new Properties()
    file.withInputStream { properties.load(it) }
    [name: file.name - '.properties', stubs: properties.stubs, baseClass: properties.baseClass]
}

repositories {
    mavenLocal()
}

configurations {
    participantStubs {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    implementation project(":customer-management:customer-management-domain")

    implementation "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-orchestration-simple-dsl-starter"
    integrationTestImplementation "io.eventuate.tram.core:eventuate-tram-spring-jdbc-kafka"
    implementation "io.eventuate.tram.core:eventuate-tram-spring-flyway"
    runtimeOnly "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-flyway"

    testImplementation "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-testing-support"

    integrationTestRuntimeOnly "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-flyway"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-flyway-test"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    integrationTestImplementation "io.eventuate.common:eventuate-common-testcontainers"
    integrationTestImplementation "io.eventuate.messaging.kafka:eventuate-messaging-kafka-testcontainers"
    integrationTestImplementation "io.eventuate.tram.core:eventuate-tram-spring-testing-support-producer-kafka"
    integrationTestImplementation "io.eventuate.tram.core:eventuate-tram-spring-testing-support-outbox"

    contractTestImplementation "io.eventuate.tram.testingsupport.springcloudcontract:eventuate-tram-spring-testing-support-cloud-contract:$eventuateTramSpringTestingSupportCloudContractVersion"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-test"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    contractTestImplementation "org.springframework.cloud:spring-cloud-starter-contract-stub-runner"
    contractTestImplementation "io.eventuate.util:eventuate-util-test:$eventuateUtilVersion"

    // Each participant's ReplyHandlersTest, such as OtherServiceReplyHandlersTest, reads its stubs from mavenLocal with stubsMode = LOCAL
    participants.each { participant ->
        participantStubs "${participant.stubs}:+:stubs"
    }
}

// generateContractTests needs each participant's contracts for the commands customer-service sends
// as a directory, so unpack them from its stubs jar into a directory named after the participant
// The stubs are resolved when the task runs, after any task that publishes them
def unpackParticipantContracts = tasks.register('unpackParticipantContracts') {
    def contractsDir = layout.buildDirectory.dir('participant-contracts')
    outputs.dir(contractsDir)
    // Within the template, other-service stands in for the participants and publishes its stubs first
    def otherService = gradle.includedBuilds.find { it.name == 'other-service' }
    if (otherService) {
        dependsOn(otherService.task(':other-subdomain-command-api:publishStubsPublicationToMavenLocal'))
    }
    doLast {
        project.delete(contractsDir)
        participants.each { participant ->
            def (group, artifact) = participant.stubs.tokenize(':')
            def stubsJars = configurations.participantStubs.incoming.artifactView {
                componentFilter { it instanceof ModuleComponentIdentifier && it.group == group && it.module == artifact }
            }.files.files
            project.copy {
                from(stubsJars.collect { zipTree(it) })
                include '**/contracts/customer-service/commands/*.groovy'
                eachFile { it.relativePath = new RelativePath(true, participant.name, it.name) }
                includeEmptyDirs = false
                into(contractsDir)
            }
        }
    }
}

contracts {
    contractsDslDir = layout.buildDirectory.dir('participant-contracts').get().asFile

    testFramework = "JUNIT5"
    basePackageForTests = "io.eventuate.customerservice.customermanagement.sagas"
    baseClassMappings {
        participants.each { participant ->
            baseClassMapping(".*${participant.name.replace('-', '.')}.*", participant.baseClass)
        }
    }

    failOnNoContracts = true
}

tasks.named('copyContracts') {
    dependsOn(unpackParticipantContracts)
}

tasks.named('contractTest') {
    dependsOn(unpackParticipantContracts)
}
