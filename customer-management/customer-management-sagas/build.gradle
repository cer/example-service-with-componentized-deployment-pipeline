plugins {
    id 'io.eventuate.plugins.gradle.testing.integration-tests'
}

apply plugin: 'org.springframework.cloud.contract'

// The contracts for the commands customer-service sends are owned by other-service. They are
// delivered by the composite build (includeBuild 'other-service' in settings.gradle) as the
// command-api module's stubs jar, selected with targetConfiguration - no Maven-layout repo involved.
ext {
    set('contractGroupId', 'io.eventuate.otherservice')
    set('contractArtifactId', 'other-subdomain-command-api')
    set('contractArtifactVersion', otherServiceStubsVersion)
}

configurations {
    otherServiceCommandStubs {
        canBeConsumed = false
    }
}

dependencies {
    implementation project(":customer-management:customer-management-domain")

    implementation "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-orchestration-simple-dsl-starter"
    implementation "io.eventuate.tram.core:eventuate-tram-spring-jdbc-kafka"
    implementation "io.eventuate.tram.core:eventuate-tram-spring-flyway"
    runtimeOnly "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-flyway"
    implementation "org.springframework.boot:spring-boot-starter-flyway"
    implementation "org.flywaydb:flyway-database-postgresql"

    testImplementation "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-testing-support"

    integrationTestRuntimeOnly "io.eventuate.tram.sagas:eventuate-tram-sagas-spring-flyway"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-flyway-test"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    integrationTestImplementation "io.eventuate.common:eventuate-common-testcontainers"
    integrationTestImplementation "io.eventuate.messaging.kafka:eventuate-messaging-kafka-testcontainers"
    integrationTestImplementation "io.eventuate.tram.core:eventuate-tram-spring-testing-support-producer-kafka"
    integrationTestImplementation "io.eventuate.tram.core:eventuate-tram-spring-testing-support-outbox"

    contractTestImplementation "io.eventuate.tram.testingsupport.springcloudcontract:eventuate-tram-spring-testing-support-cloud-contract:$eventuateTramSpringTestingSupportCloudContractVersion"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-test"
    contractTestImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    contractTestImplementation "org.springframework.cloud:spring-cloud-starter-contract-stub-runner"
    contractTestImplementation "io.eventuate.util:eventuate-util-test:$eventuateUtilVersion"

    otherServiceCommandStubs("${contractGroupId}:${contractArtifactId}:${contractArtifactVersion}") {
        targetConfiguration = 'contractStubs'
    }
    // ReplyHandlersTest consumes the stubs with stubsMode = CLASSPATH
    contractTestRuntimeOnly files(configurations.otherServiceCommandStubs)
}

// generateContractTests needs other-service's command contracts as a directory, so unpack the
// composite-built stubs jar and point contractsDslDir at the commands subtree
def unpackOtherServiceCommandStubs = tasks.register('unpackOtherServiceCommandStubs', Sync) {
    from(configurations.otherServiceCommandStubs.elements.map { locations -> locations.collect { zipTree(it) } })
    into(layout.buildDirectory.dir('other-service-command-stubs'))
}

contracts {
    contractsDslDir = layout.buildDirectory.file("other-service-command-stubs/META-INF/${contractGroupId}/${contractArtifactId}/${contractArtifactVersion}/contracts/customer-service/commands").get().asFile

    testFramework = "JUNIT5"
    basePackageForTests = "io.eventuate.customerservice.customermanagement.sagas"
    baseClassForTests = "io.eventuate.customerservice.customermanagement.sagas.BaseForOtherServiceCommandTest"

    failOnNoContracts = true
}

tasks.named('copyContracts') {
    dependsOn(unpackOtherServiceCommandStubs)
}
