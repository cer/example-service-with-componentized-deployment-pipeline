plugins {
    id 'io.eventuate.plugins.gradle.testing.integration-tests'
}

dependencies {
    implementation project(':customer-management:customer-management-domain')

    implementation 'io.eventuate.tram.core:eventuate-tram-spring-events-subscriber-starter'

    // For Idempotency
    runtimeOnly "io.eventuate.tram.core:eventuate-tram-spring-consumer-jdbc"

    // OutboxPartitioningSpec partitioning
    integrationTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-producer-jdbc'

    testImplementation 'io.eventuate.tram.core:eventuate-tram-spring-in-memory'
    testImplementation 'io.eventuate.tram.core:eventuate-tram-spring-events-publisher-starter'

    testImplementation "io.eventuate.tram.testingsupport.springcloudcontract:eventuate-tram-spring-testing-support-cloud-contract:$eventuateTramSpringTestingSupportCloudContractVersion"
    testImplementation "org.springframework.cloud:spring-cloud-starter-contract-stub-runner"
    testImplementation "io.eventuate.util:eventuate-util-test:$eventuateUtilVersion"

    integrationTestImplementation 'io.eventuate.common:eventuate-common-testcontainers'
    integrationTestImplementation 'io.eventuate.messaging.kafka:eventuate-messaging-kafka-testcontainers'
    integrationTestImplementation "io.eventuate.tram.core:eventuate-tram-spring-testing-support-producer-kafka"
    // The transport is main's (HEX-9); the integration tests start Kafka and need the consumer
    integrationTestRuntimeOnly "io.eventuate.tram.core:eventuate-tram-spring-consumer-kafka"

    integrationTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-flyway'
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-flyway"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    integrationTestRuntimeOnly "org.flywaydb:flyway-database-postgresql"

}


// Each event contract test, such as CustomerManagementEventConsumerContractTest, reads its publisher's
// stubs from mavenLocal by Maven coordinates with stubsMode = LOCAL. Within the template, other-service
// stands in for every publisher and publishes its stubs first.
def otherService = gradle.includedBuilds.find { it.name == 'other-service' }
if (otherService) {
    tasks.named('test') {
        dependsOn(otherService.task(':other-subdomain-event-publishing:publishStubsPublicationToMavenLocal'))
    }
}
