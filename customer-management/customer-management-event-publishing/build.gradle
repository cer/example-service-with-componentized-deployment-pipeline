plugins {
    id 'io.eventuate.plugins.gradle.testing.integration-tests'
}

dependencies {
    implementation project(':customer-management:customer-management-domain')
    implementation 'io.eventuate.tram.core:eventuate-tram-spring-events-publisher-starter'
    implementation 'io.eventuate.tram.core:eventuate-tram-spring-flyway'

    // OutboxPartitioningSpec partitioning
    runtimeOnly 'io.eventuate.tram.core:eventuate-tram-spring-producer-jdbc'

    integrationTestImplementation 'io.eventuate.common:eventuate-common-testcontainers'
    integrationTestImplementation 'io.eventuate.tram.core:eventuate-tram-spring-testing-support-outbox'
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-flyway"
    integrationTestImplementation "org.springframework.boot:spring-boot-starter-jdbc-test"
    integrationTestRuntimeOnly "org.flywaydb:flyway-database-postgresql"
}
