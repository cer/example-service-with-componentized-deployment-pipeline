# Manifest describing the actual structure of example-service for skeleton generation.
#
# Naming conventions:
#   transforms:   — always a list of transform names
#   classes:      — dict keyed by module, then source-set (main/test/integrationTest/componentTest/contractTest)
#   target:       — in contributes-to, the class being contributed to
#   with-classes:  — in contributes-to, associated classes created alongside the contribution
#   with-resources: — in contributes-to, resource files (e.g. contracts) created alongside the contribution,
#                    keyed by module, then source-set, as paths relative to src/<source-set>/resources
#   paths:        — in a feature, template paths copied only when the feature is applied
#
# other-service is test scaffolding, not a service to generate: it stands in for a collaborating
# service and owns the contracts that the consumer-side contract tests run against (see
# other-service/README.md). Features with such a test declare `paths: [other-service]`.
#
# Transforms (combinable):
#   rename             — substitute subdomain/entity/service names
#   strip-dependencies — remove all injected dependencies (constructor param + field + assignment)
#   strip-methods      — remove all methods
#   strip-bean-params  — remove params from @Bean methods (method itself remains)
#   strip-non-getters  — remove all methods except getters (for entity classes)
#   strip-event-publishing — remove event publishing calls from a method body (method-level)

template-names:
  service: "customer-service"
  subdomain: "customer-management"
  entity: "Customer"
  base-package: "io.eventuate.customerservice"

# ============================================================
# Service-level structure (one per service)
# ============================================================

service:
  modules:
    - customer-service-main
    - customer-service-deployment
    - customer-service-api-messaging
    - customer-service-api-web
  paths:
    - .gitignore
    - build.gradle
    - gradle.properties
    - gradle
    - gradlew
    - gradlew.bat
    - buildSrc/build.gradle
    - buildSrc/src
    - customer-service-main/src/main/resources/application.properties
    - customer-service-main/Dockerfile
    - .github
    - customer-service-deployment
    - .pre-commit-config.yaml
    - codescene-precommit.sh
  post-generate-commands:
    - pre-commit install
  validate-commands:
    - ./gradlew build

  classes:
    customer-service-main:
      main:
        - name: CustomerServiceMain
          transforms: [rename]
      componentTest:
        - name: CustomerServiceComponentTest
          transforms: [rename, strip-test-methods]
          # Result: component test shell with container setup.

  contributes-to:
    - target: CustomerServiceComponentTest
      module: customer-service-main
      source-set: componentTest
      methods:
        - shouldGetActuatorHealth
          # Entity and features contribute test methods.

# ============================================================
# Subdomain-level structure (replicated per subdomain)
# ============================================================

subdomain:
  source-dir: customer-management

  # Core modules — always present
  core:
    domain:
      classes:
        main:
          - name: CustomerManagementService
            transforms: [rename, strip-dependencies, strip-methods]
            # Result: empty class with Logger
          - name: CustomerManagementDomainConfiguration
            transforms: [rename, strip-bean-params]
            # Result: @Bean method remains with no params →
            #   new OrderManagementService()
        test:
          - name: CustomerManagementServiceTest
            transforms: [rename, strip-dependencies, strip-methods]
            # Result: test shell with mocks. Entity/features contribute test methods.

  # Entity definition — what gets replicated per entity
  entity:
    classes:
      domain:
        main:
          - name: Customer
            transforms: [rename, strip-non-getters]
          - name: CustomerId
            transforms: [rename]
          - name: CustomerRepository
            transforms: [rename]
          - name: CustomerNotFoundException
            transforms: [rename]
        test:
          - name: CustomerTest
            transforms: [rename, strip-methods]
            # Result: empty test class. Entity contributes placeholder test.

    contributes-to:
      - target: CustomerTest
        module: domain
        source-set: test
        methods:
          - shouldCreateCustomer

      - target: CustomerManagementService
        module: domain
        source-set: main
        dependencies:
          - param: CustomerRepository customerRepository
            wired-in:
              target: CustomerManagementDomainConfiguration
              bean: customerManagementService
        methods:
          - name: createCustomer
            transforms: [strip-event-publishing]
          - findAllCustomers
          - findCustomerById

      - target: CustomerManagementServiceTest
        module: domain
        source-set: test
        dependencies:
          - param: CustomerRepository customerRepository
        methods:
          - createCustomerShouldSaveAndReturnCustomer
          - findByIdShouldReturnCustomerWhenExists
          - findByIdShouldReturnEmptyWhenNotExists
          - findAllShouldReturnAllCustomers

      - target: RepositoriesTest
        module: persistence
        source-set: integrationTest
        dependencies:
          - param: CustomerRepository customerRepository
        methods:
          - shouldSaveAndLoadCustomer

      - target: CustomerManagementController
        module: rest-api
        source-set: main
        dependencies:
          - param: CustomerManagementService customerManagementService
        methods:
          - createCustomer
          - findAllCustomers
          - findCustomerById
        with-classes:
          rest-api:
            main:
              - name: CreateCustomerRequest
                transforms: [rename]
              - name: CreateCustomerResponse
                transforms: [rename]
              - name: FindCustomerResponse
                transforms: [rename]
              - name: FindCustomersResponse
                transforms: [rename]

      - target: CustomerManagementControllerTest
        module: rest-api
        source-set: test
        dependencies:
          - param: CustomerManagementService customerManagementService
        methods:
          - shouldCreateCustomer
          - shouldGetCustomers
          - shouldGetCustomer
          - shouldReturn404WhenCustomerNotFound

      - target: ContractVerifierBase
        module: rest-api
        source-set: contractTest
        dependencies:
          - param: CustomerManagementService customerManagementService
        methods:
          - stubFindCustomerById
        with-resources:
          rest-api:
            contractTest:
              - contracts/client-service/findCustomerById.groovy

  # Optional features
  features:

    persistence:
      per-entity: false
      module: persistence
      classes:
        persistence:
          main:
            - name: CustomerManagementPersistenceConfiguration
              transforms: [rename]
          integrationTest:
            - name: RepositoriesTest
              transforms: [rename, strip-test-methods, strip-dependencies]
              # Result: test shell with TestContainers setup.
              # Entity contributes save/load test methods.

    event-publishing-support:
      per-entity: false
      module: event-publishing
      classes:
        event-publishing:
          main:
            - name: CustomerManagementEventPublishingConfiguration
              transforms: [rename, strip-methods]
              # Result: @Configuration with @EnableEventuateTramFlywayMigration,
              # no bean methods. Each entity contributes its own @Bean method.
          integrationTest:
            - name: EntityIdSetter
              transforms: []
              # Helper class copied as-is, no renaming needed.
          contractTest:
            - name: BaseClass
              transforms: [rename, strip-methods]
              # Result: base class shell for the tests that Spring Cloud Contract
              # generates from src/contractTest/resources/contracts.
              # Each published entity contributes its trigger method and its contract.
        customer-service-main:
          test:
            - name: GenerateMessagingApiDocsIntegrationTest
              transforms: [rename]
      contributes-to:
        - target: CustomerServiceComponentTest
          module: customer-service-main
          source-set: componentTest
          methods:
            - shouldGetAsyncApiDocs

    event-publishing:
      per-entity: true
      condition: isPublishedEntity
      module: event-publishing
      requires: event-publishing-support
      classes:
        domain:
          main:
            - name: CustomerEventPublisher
              transforms: [rename]
            - name: CustomerEvent
              transforms: [rename]
            - name: CustomerCreatedEvent
              transforms: [rename]
        event-publishing:
          main:
            - name: CustomerEventPublisherImpl
              transforms: [rename]
          integrationTest:
            - name: CustomerEventPublishingIntegrationTest
              transforms: [rename, strip-test-methods]
              # Result: test shell with TestContainers setup.
              # Each entity contributes its own publish test.
      contributes-to:
        - target: CustomerManagementService
          module: domain
          source-set: main
          dependencies:
            - param: CustomerEventPublisher customerEventPublisher
              wired-in:
                target: CustomerManagementDomainConfiguration
                bean: customerManagementService
          method-calls:
            createCustomer: customerEventPublisher.publish
        - target: CustomerManagementEventPublishingConfiguration
          module: event-publishing
          source-set: main
          beans:
            - name: customerEventPublisher
              type: CustomerEventPublisher
              impl: CustomerEventPublisherImpl
        - target: CustomerManagementServiceTest
          module: domain
          source-set: test
          dependencies:
            - param: CustomerEventPublisher customerEventPublisher
          methods:
            - createCustomerShouldPublishCustomerCreatedEvent
        - target: CustomerEventPublishingIntegrationTest
          module: event-publishing
          source-set: integrationTest
          methods:
            - shouldPublishCustomerCreatedEvent
        - target: BaseClass
          module: event-publishing
          source-set: contractTest
          methods:
            - customerCreatedEvent
          with-resources:
            event-publishing:
              contractTest:
                - contracts/client-service/customerCreatedEvent.groovy

    event-subscribers:
      per-entity: false
      module: event-subscribers
      paths:
        - other-service
        # Composite build that delivers other-service's event stubs jar to the contract test.
      classes:
        event-subscribers:
          main:
            - name: CustomerManagementEventConsumer
              transforms: [rename]
            - name: CustomerManagementEventConsumerConfiguration
              transforms: [rename]
            - name: OtherEvent
              transforms: []
          test:
            - name: CustomerManagementEventConsumerTest
              transforms: [rename]
            - name: CustomerManagementEventConsumerContractTest
              transforms: [rename]
          integrationTest:
            - name: CustomerManagementEventConsumerIntegrationTest
              transforms: [rename]
        customer-service-main:
          test:
            - name: GenerateMessagingApiDocsIntegrationTest
              transforms: [rename]
      contributes-to:
        - target: CustomerManagementService
          module: domain
          source-set: main
          methods:
            - noteCreditReserved
        - target: CustomerServiceComponentTest
          module: customer-service-main
          source-set: componentTest
          methods:
            - shouldGetAsyncApiDocs

    other-service-proxy:
      per-entity: false
      module: other-service-proxy
      paths:
        - other-service
        # Composite build that delivers other-service's REST API stubs jar to the contract test.
      classes:
        other-service-proxy:
          main:
            - name: OtherServiceProxy
              transforms: [rename]
            - name: OtherServiceProxyConfiguration
              transforms: [rename]
            - name: GetOtherResponse
              transforms: [rename]
          test:
            - name: OtherServiceProxyTest
              transforms: [rename]
            - name: OtherServiceProxyContractTest
              transforms: [rename]
        domain:
          main:
            - name: OtherService
              transforms: [rename]
            - name: OtherDetails
              transforms: [rename]

    command-api:
      per-entity: false
      module: command-api
      classes:
        command-api:
          main:
            - name: CustomerManagementCommandHandler
              transforms: [rename, strip-methods]
              # Result: a handler with no methods. Each command contributes its handler method.
            - name: CustomerCommandHandlerConfiguration
              transforms: [rename]
            - name: CustomerManagementCommandHandlerWithFlywayConfiguration
              transforms: [rename]
          contractTest:
            - name: ContractVerifierBase
              transforms: [rename, strip-methods]
              # Each command contributes its reply triggers.
            - name: CommandHandlersTest
              transforms: [rename, strip-methods]
              # Each command contributes the test that triggers its command stub.
      resources:
        command-api:
          contractTest:
            # The H2 datasource the saga participant starter needs in the contract tests.
            - application.properties
      # Applied once for each command the adapter declares under commands, on the adapter's channel.
      # {Command}, {SuccessReply} and {FailureReply} are the command's class names, {operation} its
      # operation in camel case, {Operation} in Pascal case, and {channel} the adapter's channel.
      per-command:
        renames:
          types:
            ReserveCreditCommand: "{Command}"
            ReserveCreditResult: "{Operation}Result"
            CustomerCreditReserved: "{SuccessReply}"
            # A command has one failure reply, so the template's two are the same class.
            CustomerNotFound: "{FailureReply}"
            CustomerCreditLimitExceeded: "{FailureReply}"
            CustomerManagementCommandHandlerTest: "{Operation}CommandHandlerTest"
            CustomerManagementCommandHandlerIntegrationTest: "{Operation}CommandHandlerIntegrationTest"
          members:
            CustomerManagementCommandHandler.reserveCredit: "{operation}"
            ContractVerifierBase.reserveCredit: "{operation}"
            ContractVerifierBase.reserveCreditSuccessReply: "{operation}SuccessReply"
            ContractVerifierBase.reserveCreditFailureReply: "{operation}FailureReply"
            ContractVerifierBase.sendReserveCreditCommand: "send{Operation}Command"
            CommandHandlersTest.shouldHandleReserveCreditCommand: "shouldHandle{Operation}Command"
          literals:
            customerService: "{channel}"
            # The command stub's label, and the reply channel the contract tests use.
            reserveCredit: "{operation}"
          text:
            # In the contracts: the labels, trigger methods and reply channel, and the command channel.
            reserveCredit: "{operation}"
            customerService: "{channel}"
        classes:
          command-api:
            main:
              - name: ReserveCreditCommand
                transforms: [rename]
              - name: ReserveCreditResult
                transforms: [rename]
              - name: CustomerCreditReserved
                transforms: [rename]
              - name: CustomerNotFound
                transforms: [rename]
            test:
              - name: CustomerManagementCommandHandlerTest
                transforms: [rename]
            integrationTest:
              - name: CustomerManagementCommandHandlerIntegrationTest
                transforms: [rename]
        contributes-to:
          - target: CustomerManagementCommandHandler
            module: command-api
            source-set: main
            methods:
              - reserveCredit
          - target: ContractVerifierBase
            module: command-api
            source-set: contractTest
            methods:
              - reserveCredit
              - reserveCreditSuccessReply
              - reserveCreditFailureReply
              - sendReserveCreditCommand
          - target: CommandHandlersTest
            module: command-api
            source-set: contractTest
            methods:
              - shouldHandleReserveCreditCommand
        # Applied once for each service that sends the command: the contracts for the command and its
        # replies, laid out by that service's name.
        per-caller:
          renames:
            text:
              client-service: "{caller}"
          resources:
            command-api:
              contractTest:
                - contracts/client-service/commands/reserveCreditCommand.groovy
                - contracts/client-service/replies/reserveCreditSuccessReply.groovy
                - contracts/client-service/replies/reserveCreditFailureReply.groovy
      contributes-to:
        - target: CustomerManagementService
          module: domain
          source-set: main
          methods:
            # Without the event: CustomerCreditReservedEvent needs the event-publishing feature.
            - name: reserveCredit
              transforms: [strip-event-publishing]
          with-classes:
            domain:
              main:
                - name: CustomerCreditLimitExceededException
                  transforms: [rename]
        - target: Customer
          module: domain
          source-set: main
          methods:
            # The entity's strip-non-getters removes both.
            - availableCredit
            - reserveCredit

    sagas:
      per-entity: false
      module: sagas
      paths:
        - other-service
        # Composite build that delivers other-service's command contracts to the contract tests.
      # Applied once per subdomain. The per-saga part below is applied once for each saga the
      # subdomain declares under domain.sagas.
      classes:
        sagas:
          main:
            - name: CustomerManagementSagasConfiguration
              transforms: [rename, strip-methods]
              # Result: empty @Configuration; the proxy and per-saga beans are contributed.
            - name: OtherServiceProxy
              transforms: [rename]
              # Saga participant proxy for the collaborating service. Distinct from the
              # rest-api OtherServiceProxy in the other-service-proxy module.
            # other-service's command and replies, which OtherServiceProxy sends and handles.
            # They contain no template name, so they keep the package the contracts name.
            - name: AuthorizePaymentCommand
              transforms: []
            - name: AuthorizePaymentResult
              transforms: []
            - name: PaymentDeclined
              transforms: []
            - name: PaymentAuthorized
              transforms: []
          contractTest:
            - name: BaseForOtherServiceCommandTest
              transforms: [rename]
              # Keeps authorizePayment(), which the contract test generated from
              # authorizePaymentCommand.groovy calls.
            - name: ReplyHandlersTest
              transforms: [rename]
        domain:
          main:
            - name: RejectionReason
              transforms: [rename]
            - name: CreditReservationDetails
              transforms: [rename]
      contributes-to:
        - target: CustomerManagementSagasConfiguration
          module: sagas
          source-set: main
          beans:
            - name: otherServiceProxy
              type: OtherServiceProxy
              impl: OtherServiceProxy
          with-resources:
            sagas:
              contractTest:
                # The H2 datasource the saga orchestration starter needs in the contract tests.
                - application.properties

      per-saga:
        # {Saga} is the saga's name in Pascal case, {saga} in camel case. A type is renamed wherever
        # it appears as a whole identifier. A member, Class.member, is renamed in its class and
        # wherever it is referenced through a variable of that class's type. A literal is a
        # substring renamed inside string literals.
        renames:
          types:
            ReserveCreditSaga: "{Saga}Saga"
            ReserveCreditSagaData: "{Saga}SagaData"
            ReserveCreditSagaTest: "{Saga}SagaTest"
            ReserveCreditSagaIntegrationTest: "{Saga}SagaIntegrationTest"
            CustomerManagementSagaService: "{Saga}SagaService"
            CustomerManagementSagaServiceTest: "{Saga}SagaServiceTest"
            ReserveCreditRequest: "{Saga}Request"
            ReserveCreditResponse: "{Saga}Response"
          members:
            CustomerManagementSagaService.reserveCredit: "{saga}"
            CustomerManagementSagaService.reserveCreditSaga: "{saga}Saga"
            CustomerManagementSagasConfiguration.reserveCreditSaga: "{saga}Saga"
            CustomerManagementSagasConfiguration.creditReservationSagaService: "{saga}SagaService"
            CustomerManagementService.noteCreditReservationPending: "note{Saga}Pending"
            CustomerManagementService.noteCreditReservationApproved: "note{Saga}Approved"
            CustomerManagementService.noteCreditReservationRejected: "note{Saga}Rejected"
            CustomerManagementController.customerManagementSagaService: "{saga}SagaService"
            CustomerManagementController.createCreditReservation: "{saga}"
            CustomerManagementControllerTest.customerManagementSagaService: "{saga}SagaService"
            CustomerManagementControllerTest.shouldReserveCredit: "should{Saga}"
            ContractVerifierBase.customerManagementSagaService: "{saga}SagaService"
          literals:
            # The REST path of the controller method that starts the saga, and of its test.
            # {saga-kebab} is the saga's name in kebab case: placeOrder gives place-order.
            creditreservations: "{saga-kebab}"
        classes:
          sagas:
            main:
              - name: ReserveCreditSaga
                transforms: [rename]
              - name: ReserveCreditSagaData
                transforms: [rename]
              - name: CustomerManagementSagaService
                transforms: [rename]
            test:
              - name: ReserveCreditSagaTest
                transforms: [rename]
              - name: CustomerManagementSagaServiceTest
                transforms: [rename]
            integrationTest:
              - name: ReserveCreditSagaIntegrationTest
                transforms: [rename]
        contributes-to:
          - target: CustomerManagementSagasConfiguration
            module: sagas
            source-set: main
            beans:
              - name: reserveCreditSaga
                type: ReserveCreditSaga
                impl: ReserveCreditSaga
              - name: creditReservationSagaService
                type: CustomerManagementSagaService
                impl: CustomerManagementSagaService
          - target: CustomerManagementService
            module: domain
            source-set: main
            methods:
              - noteCreditReservationPending
              - noteCreditReservationApproved
              - noteCreditReservationRejected
          - target: CustomerManagementController
            module: rest-api
            source-set: main
            dependencies:
              - param: CustomerManagementSagaService customerManagementSagaService
            methods:
              - createCreditReservation
            with-classes:
              rest-api:
                main:
                  - name: ReserveCreditRequest
                    transforms: [rename]
                  - name: ReserveCreditResponse
                    transforms: [rename]
          - target: CustomerManagementControllerTest
            module: rest-api
            source-set: test
            dependencies:
              - param: CustomerManagementSagaService customerManagementSagaService
            methods:
              - shouldReserveCredit
          - target: ContractVerifierBase
            module: rest-api
            source-set: contractTest
            dependencies:
              - param: CustomerManagementSagaService customerManagementSagaService

    rest-api:
      per-entity: false
      module: rest-api
      classes:
        rest-api:
          main:
            - name: CustomerManagementController
              transforms: [rename, strip-dependencies, strip-methods]
              # Result: empty @RestController
            - name: CustomerManagementWebConfiguration
              transforms: [rename]
            - name: CustomerManagementWebSecurityConfiguration
              transforms: [rename]
          test:
            - name: CustomerManagementControllerTest
              transforms: [rename, strip-dependencies, strip-test-methods]
              # Result: test shell with MockMvc setup.
              # Entity and features contribute test methods.
          contractTest:
            - name: ContractVerifierBase
              transforms: [rename, strip-dependencies, strip-methods]
              # Result: base class shell for the tests that Spring Cloud Contract
              # generates from src/contractTest/resources/contracts.
        customer-service-main:
          test:
            - name: GenerateRestApiDocsIntegrationTest
              transforms: [rename]
      also-apply:
        - rest-api-component-test
        - rest-api-event-publishing-component-test
      contributes-to:
        - target: CustomerServiceComponentTest
          module: customer-service-main
          source-set: componentTest
          methods:
            - shouldGetSwaggerUi
            - shouldGetOpenApiDocs
        - target: ContractVerifierBase
          module: rest-api
          source-set: contractTest
          methods:
            - setUpRestAssuredMockMvc
            - resetRestAssuredMockMvc
            # Each entity contributes its service mock, its stub method and its contract.

    rest-api-component-test:
      per-entity: true
      condition: hasRestApiWithoutEventPublishing
      module: rest-api
      contributes-to:
        - target: CustomerServiceComponentTest
          module: customer-service-main
          source-set: componentTest
          methods:
            - name: shouldCreateAndGetCustomer
              transforms: [strip-marked-section:EVENT-PUBLISHING-SPECIFIC]

    rest-api-event-publishing-component-test:
      per-entity: true
      condition: hasRestApiAndEventPublishing
      module: rest-api
      contributes-to:
        - target: CustomerServiceComponentTest
          module: customer-service-main
          source-set: componentTest
          methods:
            - shouldCreateAndGetCustomer
