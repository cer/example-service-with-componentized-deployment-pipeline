buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }
    dependencies {
        classpath "org.springframework.cloud:spring-cloud-contract-gradle-plugin:$springCloudContractDependenciesVersion"
        // Required for contractsMode = REMOTE, which resolves contracts from a Maven repository
        classpath "org.springframework.cloud:spring-cloud-contract-stub-runner:$springCloudContractDependenciesVersion"
        classpath "io.eventuate.tram.testingsupport.springcloudcontract:eventuate-tram-spring-testing-support-cloud-contract-plugins-gradle:$eventuateTramSpringTestingSupportCloudContractVersion"
    }
}

// Defines contractRepoDir/contractRepoUrl, the local Maven repo that PublishStubsPlugin publishes stubs to
apply plugin: io.eventuate.tram.spring.testing.cloudcontract.plugins.gradle.ConfigureContractRepoDirPlugin

allprojects {
    group = "io.eventuate.customerservice"
}

subprojects {

    apply plugin: "java-library"
    apply plugin: "io.spring.dependency-management"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    repositories {
        mavenCentral()
        eventuateMavenRepoUrl.split(',').each { repoUrl -> maven { url repoUrl } }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:$springBootVersion"
            mavenBom "io.eventuate.platform:eventuate-platform-dependencies:$eventuatePlatformVersion"
            mavenBom "org.springframework.cloud:spring-cloud-contract-dependencies:$springCloudContractDependenciesVersion"

        }
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs += '-parameters'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    dependencies {

        testImplementation "org.springframework.boot:spring-boot-starter-test"
        testImplementation "org.assertj:assertj-core"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    }

    tasks.withType(Copy).all { duplicatesStrategy 'WARN' }

    if (System.getenv("GRADLE_CACHE_CHANGING_VERSIONS_IN_MINUTES") != null)
        configurations.all {
            resolutionStrategy.cacheChangingModulesFor Integer.parseInt(System.getenv("GRADLE_CACHE_CHANGING_VERSIONS_IN_MINUTES")), 'minutes'
        }

}

task compileAll(type: GradleBuild) {
    tasks = ["componentTestClasses", "integrationTestClasses", "contractTestClasses", "testClasses", "assemble"]
}
